name: CI - Build, Test and Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v7

      - name: 2. Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 4. Validación sintáctica
        run: python -m compileall -q app.py tests

      - name: 5. Análisis estático con Ruff
        run: ruff check app.py tests

      - name: 6. Ejecutar pruebas y cobertura
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: 7. Publicar evidencia de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
